name: Deploy automático tras push
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run build
      - name: Deploy Firebase Hosting
        run: npx firebase deploy --only hosting --token "${{ secrets.FIREBASE_TOKEN }}"
